name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download & Install Trunk
        run: |
          # Download pre-built trunk binary to speed up build
          TRUNK_VERSION=$(curl -s https://api.github.com/repos/trunk-rs/trunk/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          curl -L "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf-
          sudo mv trunk /usr/local/bin/

      - name: Build with Trunk
        run: trunk build --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.MAJEH_EMAIL_SERVICE_ACCOUNT }}'
          projectId: majehs-email-browserr
          channelId: live
