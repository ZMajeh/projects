<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majeh's Email Browserr</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
        }

        #app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .thread-list {
            width: 350px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .viewport {
            flex: 1;
            background: #fff;
            padding: 40px;
            overflow-y: auto;
        }

        .nav-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background: #f0f0f0;
        }

        .email-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .email-item:hover {
            background: #f9f9f9;
        }

        .email-item h4 {
            margin: 0 0 5px 0;
            color: #333;
        }

        .email-item p {
            margin: 0;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
